server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - let React Router handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for Vite's content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }
}
