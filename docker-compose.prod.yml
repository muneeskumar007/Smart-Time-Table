name: smart-timetable-prod

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not port-mapped to the host in production - only reachable by
    # other containers on this network. Use `docker compose exec mongo
    # mongosh` for admin access.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      ENVIRONMENT: production
      DEBUG: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Not port-mapped to the host - only the nginx container talks to
    # this directly, per the reverse-proxy architecture in nginx/nginx.conf.

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Not port-mapped to the host either - nginx is the only container
    # that accepts traffic from outside the Docker network.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo_data_prod:
